services:
  postgres:
    image: postgres:16-alpine
    container_name: edsync-postgres
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edsync}
      POSTGRES_USER: ${POSTGRES_USER:-edsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edsync_dev_password}
    volumes:
      - edsync-postgres-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edsync} -d ${POSTGRES_DB:-edsync}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  edsync-postgres-data:
